# pnpm settings (pnpm >= 11 no longer reads non-auth settings from .npmrc)

# esbuild runs a postinstall script that validates its platform binary.
allowBuilds:
  esbuild: true
  rumdl: true

# @jaeungkim/gantt-chart declares react/react-dom peers; Unimian resolves them to preact/compat
# through build aliases (scripts/ui-runtime-aliases.mjs) and must not install React.

# eslint-plugin-obsidianmd pins its obsidian peer to 1.8.7; the plugin targets a newer API.
peerDependencyRules:
  allowedVersions:
    "eslint-plugin-obsidianmd>obsidian": "1.14.4"
  ignoreMissing:
    - react
    - react-dom

# Ask before installing a version younger than the minimum release age; never exclude it silently.
minimumReleaseAgeStrict: true
