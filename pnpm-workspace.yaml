# pnpm settings (pnpm >= 11 no longer reads non-auth settings from .npmrc)

# esbuild runs a postinstall script that validates its platform binary.
allowBuilds:
  esbuild: true

# @jaeungkim/gantt-chart declares react/react-dom peers; Unimian resolves them to preact/compat
# through build aliases (scripts/ui-runtime-aliases.mjs) and must not install React.
minimumReleaseAgeExclude:
  - dotenv@18.0.2

peerDependencyRules:
  ignoreMissing:
    - react
    - react-dom
