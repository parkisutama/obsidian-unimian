name: Release Obsidian plugin

on:
    push:
        tags:
            - "*.*.*"

permissions:
    contents: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: pnpm/action-setup@v6
              with:
                  run_install: false

            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".node-version"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Verify tag matches manifest version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version="$(node -p "require('./manifest.json').version")"

                  if [ "$tag" != "$manifest_version" ]; then
                    echo "Release tag ($tag) must match manifest.json version ($manifest_version)."
                    exit 1
                  fi

            - name: Check and build plugin
              run: pnpm run verify

            - name: Package plugin zip
              run: zip -j unimian.zip dist/main.js dist/manifest.json dist/styles.css LICENSE THIRD_PARTY_NOTICES.md

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --generate-notes \
                    dist/main.js dist/manifest.json dist/styles.css LICENSE THIRD_PARTY_NOTICES.md unimian.zip
