[global]

# MD013: prose uses semantic line breaks, not a column limit.
disable = ["MD013"]

# CHANGELOG.md is written by the release tooling in its own format.
exclude = [".git", ".github", "node_modules", "dist", "coverage", ".claude", "CHANGELOG.md"]

respect-gitignore = true

# Documents carry `title` in frontmatter and repeat it as the single H1.
[MD025]
front-matter-title = ""
